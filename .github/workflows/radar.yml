name: viral-radar

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: viral-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: state.json
          key: radar-state-${{ github.run_id }}
          restore-keys: radar-state-

      - run: python main.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          ALERT_THRESHOLD: ${{ vars.ALERT_THRESHOLD || '60' }}
          GEOS: ${{ vars.GEOS || 'NG,US,GB,KR,JP,IN,ZA' }}
          TOPICS: ${{ vars.TOPICS || 'all' }}
          MODE: ${{ vars.MODE || 'general' }}
          MEME_MIN_SCORE: ${{ vars.MEME_MIN_SCORE || '6' }}
          MEME_MIN_LIQUIDITY: ${{ vars.MEME_MIN_LIQUIDITY || '5000' }}
          CHAINS: ${{ vars.CHAINS || 'solana,base,bsc,ethereum' }}
